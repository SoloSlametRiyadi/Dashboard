<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Sosri</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b3a6b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#fff;font-family:sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#e{padding:24px;font-size:14px}
</style>
</head>
<body>
<script>
// Ganti dengan URL Web App Apps Script (berakhiran /exec). Setelah ini semua perubahan cukup dilakukan di Apps Script.
const APP_URL = 'https://script.google.com/macros/s/AKfycbz0OpR8pYxZ43cR3sMhYKChc13hCSxGusVCAXjqhmzkFZh5W3xQqpww0FCFkOZAtGU/exec';
if (/^https:\/\//.test(APP_URL)) {
  const f = document.createElement('iframe');
  f.src = APP_URL; f.allow = 'fullscreen';
  document.body.appendChild(f);
} else document.body.innerHTML = '<div id="e">APP_URL belum diisi di index.html</div>';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
